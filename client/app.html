<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram Admin Panel</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brandlogo">TA</div><div><b>TELEGRAM ADMIN</b><small>Panel</small></div></div>
    <div class="sect">MAIN</div>
    <div class="nav active" data-page="dashboard"><i>⌂</i><span>Dashboard</span></div>
    <div class="nav" data-page="messages"><i>✉</i><span>Messages</span><em class="count" id="msgCount">0</em></div>
    <div class="nav" data-page="settings"><i>⚙</i><span>Settings</span></div>
    <div class="system">
      <b>SYSTEM STATUS</b>
      <p><span id="apiStatus" class="ok">● API Service</span><span id="apiStatusText">Checking…</span></p>
      <p><span id="botStatus" class="ok">● Telegram Bot</span><span id="botStatusText">Checking…</span></p>
    </div>
    <button class="btn danger" id="logoutBtn">Logout</button>
  </aside>
  <main class="main">
    <header class="top">
      <div class="search">⌕ <input id="globalSearch" placeholder="Search messages…"></div>
      <div class="push"></div>
      <span class="muted" id="clockText"></span>
      <div class="avatar" id="avatarInitial">A</div>
      <b id="userEmailLabel">Admin</b>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
