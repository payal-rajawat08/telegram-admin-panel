<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram Admin Panel — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="authwrap">
  <div class="card authcard">
    <div class="authbrand">
      <div class="authlogo">TA</div>
      <div><b>Telegram Admin</b><small>Panel</small></div>
    </div>
    <div class="tabs2">
      <button id="tabLogin" class="active" type="button">Login</button>
      <button id="tabRegister" type="button">Register</button>
    </div>
    <div id="authError" class="autherr"></div>
    <form id="authForm" class="authform">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="admin@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn primary" id="submitBtn">Login</button>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
